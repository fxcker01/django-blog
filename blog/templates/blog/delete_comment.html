{% extends 'blog/base.html' %}

{% block title %}Delete Comment{% endblock %}

{% block content %}
<div class="card bg-dark text-light p-4 mt-4 shadow-sm">
  <h2 class="fw-bold text-danger mb-3">Confirm Deletion</h2>
  <p class="fs-5 mb-4">
    Are you sure you want to delete this comment?
  </p>

  <form method="post" class="d-flex flex-wrap gap-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger px-4">
      <i class="bi bi-trash me-1"></i> Yes, delete
    </button>
    <a href="{{ object.post.get_absolute_url }}" class="btn btn-outline-secondary px-4">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
