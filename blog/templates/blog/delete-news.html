{% extends 'blog/base.html' %}

{% block title %}
    Delete article
{% endblock %}

{% block content %}
<div class="card bg-dark text-light p-4 mt-4 shadow-sm">
    <h2 class="fw-bold text-danger mb-3">Confirm Deletion</h2>
    <p class="fs-5">
        Are you sure you want to delete the article
        <span class="text-accent">"{{ object.title }}"</span>?
    </p>

    <form method="post" class="mt-4 d-flex flex-wrap gap-3">
        {% csrf_token %}
        <button class="btn btn-outline-danger px-4" type="submit">
            <i class="bi bi-trash me-1"></i> Yes, delete
        </button>
        <a href="{% url 'news-detail' object.id %}" class="btn btn-outline-secondary px-4">
            Cancel
        </a>
    </form>
</div>
{% endblock %}

{% block aside_block %}
<div class="col-lg-3 sidebar ml-5">
    {% include 'blog/sidebar.html' %}
</div>
{% endblock %}
