{% extends 'blog/base.html' %}

{% block title %}Edit Comment{% endblock %}

{% block content %}
<div class="card bg-dark text-light p-4 mt-4 shadow-sm">
  <h2 class="fw-bold text-accent mb-3">Edit Comment</h2>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      {{ form.body|safe }}
    </div>
    <button type="submit" class="btn btn-outline-success text-light px-4 me-2">
      <i class="bi bi-save me-1"></i> Save
    </button>
    <a href="{{ object.post.get_absolute_url }}" class="btn btn-outline-secondary px-4">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
