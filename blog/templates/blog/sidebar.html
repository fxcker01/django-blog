<div class="mb-4">
  <h4>Interesting articles</h4>

<div class="row gx-2">
  {% for article in top_articles %}
    <div class="col-12 col-md-6 col-lg-12 mt-3">
        <div class="sidebar-card p-2 rounded bg-dark shadow-sm h-100">
            {% if article.image %}
              <img src="{{ article.image.url }}" class="img-thumbnail mb-2 w-100">
            {% endif %}
            <p class="mt-2">{{ article.title|truncatechars:60 }}</p>

            <div class="d-flex flex-wrap justify-content-between text-secondary small mb-2">
                <span><i class="bi bi-eye me-1"></i>{{ article.views }}</span>
                <span><i class="bi bi-hand-thumbs-up me-1"></i>{{ article.total_likes }}</span>
                <span><i class="bi bi-chat-left-text me-1"></i>{{ article.comments.count }}</span>
                <span><i class="bi bi-calendar3 me-1"></i>{{ article.date|date:"d M Y" }}</span>
            </div>

            <a href="{% url 'news-detail' article.pk %}">
              <button class="btn btn-outline-primary text-light btn-sm">View</button>
            </a>
        </div>
    </div>
    {% empty %}
      <p>There are no popular articles yet.</p>
    {% endfor %}
  </div>
</div>
